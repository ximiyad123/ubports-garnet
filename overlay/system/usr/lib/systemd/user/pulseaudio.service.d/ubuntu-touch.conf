[Service]
# Use the Touch specific Pulseaudio script file
Environment=PULSE_SCRIPT=/etc/pulse/touch.pa

# Audio HAL shared library is ordinarily loaded by Audio HAL process from
# /vendor partition, so we need to use vendor namespace, or it won't be able
# to find its dependencies.
Environment=HYBRIS_USE_VENDOR_NAMESPACE=1

# Reads additional arguments for pulseaudio-modules-droid
# (consumed by pulseaudio-modules-droid-discover).
ExecStartPre=/usr/libexec/ubuntu-touch-session/get_pa_modules_droid_extra_args
EnvironmentFile=-%t/pa_modules_droid_args
