name: Build System Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            xz-utils \
            curl \
            wget \
            ca-certificates \
            kmod \
            cpio \
            python3 \
            android-sdk-libsparse-utils \
            lz4 \
            sudo \
            && sudo rm -rf /var/lib/apt/lists/*

      - name: Run build scripts
        run: |
          cd "$GITHUB_WORKSPACE"

          find . -type f -name "*.sh" -exec chmod +x {} +

          ./build.sh
          ./build/prepare-fake-ota.sh out/device_garnet_usrmerge.tar.xz ota
          sudo ./build/system-image-from-ota.sh ota/ubuntu_command images
          ./make-installer-images.sh

      - name: Generate release description
        id: release
        run: |
          set -e

          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -n 1)

          echo "Previous release: ${PREVIOUS_TAG:-none}"

          if [ -n "$PREVIOUS_TAG" ]; then
            git log "${PREVIOUS_TAG}..HEAD" \
              --pretty=format:'- %s (%h)' \
              --no-merges > changelog.txt
          else
            git log HEAD \
              --pretty=format:'- %s (%h)' \
              --no-merges > changelog.txt
          fi

          {
            cat README.md

            echo
            echo
            echo "## Changelog"
            echo

            if [ -s changelog.txt ]; then
              cat changelog.txt
            else
              echo "No changes since the previous release."
            fi

            echo
            echo
            echo "---"
            echo
            echo "Built from commit \`$GITHUB_SHA\`."
          } > release-body.md

          RELEASE_NAME=$(git log -1 --pretty=format:'%s')

          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.release_name }}
          body_path: release-body.md
          files: |
            out/ubports-garnet-installer*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
