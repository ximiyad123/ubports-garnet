name: Build System Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            xz-utils \
            curl \
            wget \
            ca-certificates \
            kmod \
            cpio \
            python3 \
            android-sdk-libsparse-utils \
            lz4 \
            sudo \
            && sudo rm -rf /var/lib/apt/lists/*

      - name: Run build scripts
        run: |
          cd "$GITHUB_WORKSPACE"

          find . -type f -name "*.sh" -exec chmod +x {} +

          ./build.sh
          ./build/prepare-fake-ota.sh out/device_garnet_usrmerge.tar.xz ota
          sudo ./build/system-image-from-ota.sh ota/ubuntu_command images
          ./make-installer-images.sh

      - name: Generate release description
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Read Ubuntu Touch release from deviceinfo
          UT_RELEASE=$(sed -n \
            's/^deviceinfo_ubuntu_touch_release="\([^"]*\)"/\1/p' \
            deviceinfo)

          if [ -z "$UT_RELEASE" ]; then
            echo "ERROR: deviceinfo_ubuntu_touch_release not found in ./deviceinfo"
            exit 1
          fi

          echo "Ubuntu Touch release: $UT_RELEASE"

          # Generate date as DDMMYYYY
          DATE=$(date '+%d%m%Y')

          # Release title
          RELEASE_NAME="Ubuntu Touch ${UT_RELEASE} ${DATE}"

          echo "Release name: $RELEASE_NAME"

          # Get the tag of the latest GitHub Release
          PREVIOUS_TAG=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')

          echo "Previous release tag: ${PREVIOUS_TAG:-none}"

          # Generate changelog ONLY from commits after the previous release
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "${PREVIOUS_TAG}..HEAD" \
              --pretty=format:'- %s (%h)' \
              --no-merges > changelog.txt
          else
            echo "No previous release found. Using all commits."
            git log HEAD \
              --pretty=format:'- %s (%h)' \
              --no-merges > changelog.txt
          fi

          # Create release description:
          #
          # README.md
          #
          # ---
          #
          # commits since previous release
          {
            cat README.md

            echo
            echo
            echo "---"
            echo

            if [ -s changelog.txt ]; then
              cat changelog.txt
            else
              echo "No changes since the previous release."
            fi
          } > release-body.md

          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          # Unique tag for this release
          echo "tag=build-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.release_name }}
          body_path: release-body.md
          files: |
            out/ubports-garnet-installer*
        env:
          GITHUB_TOKEN: ${{ github.token }}
